<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店面庫存智慧盤點系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .action-box {
            background: #e8f6f3;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1abc9c;
        }
        .merge-box {
            background: #f4f1ea;
            padding: 20px;
            border-radius: 8px;
            border: 1px dashed #d35400;
        }
        
        .box-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: bold;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
        }

        .file-inputs {
            display: flex;
            gap: 15px;
            flex-direction: column;
            margin-bottom: 15px;
        }
        .file-input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #16a085;
        }
        .merge-box .file-input-group label {
            color: #d35400;
        }
        .file-input-group input {
            width: 100%;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button.action-btn {
            padding: 12px 15px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
            flex: 1;
        }
        button.action-btn:hover { background-color: #1abc9c; }

        button.export-btn { background-color: #f39c12; }
        button.export-btn:hover { background-color: #e67e22; }

        button.print-btn { background-color: #2c3e50; }
        button.print-btn:hover { background-color: #34495e; }

        button.reset-btn { background-color: #c0392b; }
        button.reset-btn:hover { background-color: #e74c3c; }

        .save-status {
            text-align: center;
            font-size: 13px;
            color: #16a085;
            background: #e8f6f3;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 15px;
        }
        .save-status.warn { color: #c0392b; background: #fadbd8; }

        button.merge-btn { background-color: #8e44ad; width: 100%;}
        button.merge-btn:hover { background-color: #9b59b6; }
        
        /* 倉庫專用搜尋區塊 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #eaf2f8;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3498db;
        }
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            transition: border 0.3s;
        }
        .search-box input:focus {
            border-color: #3498db;
            outline: none;
        }
        .search-box button {
            padding: 12px 20px;
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-box button:hover { background-color: #95a5a6; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        /* 盤點輸入框 */
        input[type="number"] {
            width: 90px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            transition: border 0.3s;
        }
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            background-color: #e8f6f3;
        }

        /* 狀態顏色 */
        .shortage { color: #e74c3c; font-weight: bold; }
        .surplus { color: #3498db; font-weight: bold; }
        .match { color: #27ae60; font-weight: bold; }

        /* 前20大稽查重點標示 */
        .top-20-row { background-color: #fff3cd !important; }
        .alert-badge {
            background-color: #e74c3c;
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: bold;
            vertical-align: middle;
        }
        
        .instruction {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; }
        }

        /* ========== PDF與列印專用樣式 ========== */
        @media print {
            body {
                background-color: white;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .container {
                box-shadow: none;
                border: none;
                padding: 0;
                max-width: 100%;
            }
            .control-panel, .search-box, .instruction, .save-status {
                display: none !important;
            }
            input[type="number"] {
                border: none;
                background: transparent;
                font-weight: bold;
                font-size: 16px;
            }
            th {
                position: static;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 店面專屬庫存盤點報告</h1>
    <div class="instruction">
        門市人員可直接下滑盤點；倉庫人員可利用下方「搜尋列」快速找貨。
    </div>
    <div id="saveStatus" class="save-status">💾 輸入的資料會自動存在這台裝置的瀏覽器中，不會上傳到任何地方。</div>

    <div class="control-panel">
        <div class="action-box">
            <h3 class="box-title">📊 步驟 1：系統庫存比對</h3>
            <div class="file-inputs" style="flex-direction: row; gap: 15px;">
                <div class="file-input-group" style="flex: 1;">
                    <label>上傳即時期間庫存表</label>
                    <input type="file" id="fileStock" accept=".csv, .xlsx, .xls, .ods">
                </div>
                <div class="file-input-group" style="flex: 1;">
                    <label>上傳金額排序表 (取前20)</label>
                    <input type="file" id="fileTop20" accept=".csv, .xlsx, .xls, .ods">
                </div>
            </div>
            <div class="button-group">
                <button class="action-btn" id="btnCompare" onclick="compareData()">比對差異</button>
                <button class="action-btn export-btn" onclick="exportToExcel()">📤 匯出 Excel</button>
                <button class="action-btn print-btn" onclick="window.print()">🖨️ 儲存畫面為 PDF</button>
                <button class="action-btn reset-btn" onclick="clearAllData()">🗑️ 清空重新盤點</button>
            </div>
        </div>

        <div class="merge-box">
            <h3 class="box-title">👨‍🤝‍👨 步驟 2：多人盤點合併 (選填)</h3>
            <div class="file-inputs">
                <div class="file-input-group">
                    <label>上傳同事的盤點檔 (Excel)</label>
                    <input type="file" id="fileMerge" accept=".xlsx, .xls">
                </div>
            </div>
            <button class="action-btn merge-btn" id="btnMerge" onclick="mergeData()">🔄 匯入並加總數量</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="🔍 快速搜尋：輸入項次或品名 (例如: 0316 或 達喜)...">
        <button onclick="clearSearch()">清除重填</button>
    </div>

    <div id="tableContainer"></div>
</div>

<script>
    window.addEventListener('error', function(e) {
        setTimeout(() => {
            const tc = document.getElementById('tableContainer');
            if(tc && tc.innerHTML.trim() === '') {
                tc.innerHTML = `<div style="color:#c0392b; text-align:center; padding:20px; border:2px dashed #e74c3c; background:#fadbd8; margin-top:20px; border-radius:8px;">
                    <h3 style="margin-top:0;">⚠️ 哎呀！網頁程式碼出現語法錯誤</h3>
                    <p>請檢查您的商品清單格式是否正確，或直接重新複製一次上面的完整程式碼喔！</p>
                </div>`;
            }
        }, 500);
    });
</script>

    let stockData = null;  
    let top20Data = new Set(); 
    let userCounts = {};

    // ========== 自動儲存（只存在這台裝置的瀏覽器，不會上傳） ==========
    const STORAGE_KEY = 'jiadong_inventory_count_v1';

    function formatTime(ts) {
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()} ` +
               `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function setSaveStatus(text, isWarn) {
        const el = document.getElementById('saveStatus');
        if (!el) return;
        el.textContent = text;
        el.className = 'save-status' + (isWarn ? ' warn' : '');
    }

    function saveState() {
        try {
            const now = Date.now();
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                userCounts: userCounts,
                stockData: stockData,
                top20Data: Array.from(top20Data),
                savedAt: now
            }));
            setSaveStatus(`💾 已自動儲存（${formatTime(now)}），重新整理或關掉網頁也不會消失。資料只存在這台裝置。`, false);
        } catch (e) {
            setSaveStatus('⚠️ 這個瀏覽器無法自動儲存（可能是無痕模式），請記得常按「匯出 Excel」備份！', true);
        }
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const saved = JSON.parse(raw);
            userCounts = saved.userCounts || {};
            stockData = saved.stockData || null;
            top20Data = new Set(saved.top20Data || []);
            const filled = Object.values(userCounts).filter(v => v !== '' && v !== null && v !== undefined).length;
            if (saved.savedAt) {
                setSaveStatus(`💾 已載入上次的盤點進度（${formatTime(saved.savedAt)}，已填 ${filled} 項）。要開始新的盤點請按「清空重新盤點」。`, false);
            }
        } catch (e) {
            setSaveStatus('⚠️ 這個瀏覽器無法自動儲存（可能是無痕模式），請記得常按「匯出 Excel」備份！', true);
        }
    }

    function clearAllData() {
        if (!confirm('確定要清空所有盤點數量和庫存比對資料嗎？\n建議先按「匯出 Excel」備份。清空後無法復原。')) return;
        userCounts = {};
        stockData = null;
        top20Data = new Set();
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        document.getElementById('fileStock').value = '';
        document.getElementById('fileTop20').value = '';
        document.getElementById('searchInput').value = '';
        setSaveStatus('🗑️ 已清空，可以開始新的盤點。輸入的資料會自動存在這台裝置。', false);
        renderTable();
    }

    loadState();

    function cleanString(str) {
        if (!str) return '';
        return String(str).replace(/\s+/g, '').toLowerCase();
    }

    function checkIsTop20(pId, productName) {
        let isTop20 = false;
        const cleanProductName = cleanString(productName);
        const pIdInt = parseInt(pId, 10).toString(); 
        
        if (top20Data.size > 0) {
            if (top20Data.has(pId) || top20Data.has(pIdInt)) {
                isTop20 = true;
            } else {
                for (let topItem of top20Data) {
                    if (cleanProductName === topItem || (topItem.length >= 3 && cleanProductName.length >= 3 && (cleanProductName.includes(topItem) || topItem.includes(cleanProductName)))) {
                        isTop20 = true; break;
                    }
                }
            }
        }
        return isTop20;
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderTable();
    }

    function readExcelFile(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve([]); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    
                    let headerIdx = 0;
                    for (let i = 0; i < rows.length; i++) {
                        const rowStr = rows[i].join("");
                        if (rowStr.includes("項次") || rowStr.includes("品名") || rowStr.includes("名稱") || rowStr.includes("商品")) {
                            headerIdx = i; break;
                        }
                    }
                    
                    const headers = rows[headerIdx] || [];
                    const jsonData = [];
                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        let obj = {};
                        headers.forEach((h, colIdx) => {
                            if (h && typeof h === 'string') {
                                obj[h.replace(/"/g, '').trim()] = row[colIdx];
                            }
                        });
                        jsonData.push(obj);
                    }
                    resolve(jsonData);
                } catch (err) { reject(err); }
            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    async function compareData() {
        const fileStock = document.getElementById('fileStock').files[0];
        const fileTop20 = document.getElementById('fileTop20').files[0];

        if (!fileStock) {
            alert('請先上傳「即時期間庫存表」，才能進行數量比對！');
            return;
        }

        try {
            document.getElementById('btnCompare').innerText = '資料比對中...';
            const [rawStock, rawTop20] = await Promise.all([
                readExcelFile(fileStock),
                readExcelFile(fileTop20)
            ]);

            const tempStockByName = {};
            const tempStockById = {};
            const tempStockByIdInt = {};

            rawStock.forEach(row => {
                let rawId = String(row['項次'] || '').trim();
                let rawName = '';
                for (let key in row) {
                    if (key.includes('品名') || key.includes('名稱') || key.includes('商品')) {
                        rawName = String(row[key]).trim(); break;
                    }
                }
                
                let qty = 0;
                for (let key in row) {
                    if (key.includes('結存') || key === '數量' || key === '庫存') {
                        qty = row[key]; break;
                    }
                }
                if (typeof qty === 'string') qty = qty.replace(/,/g, '');
                qty = Number(qty) || 0;

                if (rawName) tempStockByName[cleanString(rawName)] = qty;
                if (rawId) {
                    tempStockById[rawId] = qty;
                    tempStockByIdInt[parseInt(rawId, 10)] = qty;
                }
            });

            stockData = {};
            productsData.forEach(product => {
                const pId = product.id;
                const cleanName = cleanString(product.name);
                const pIdInt = parseInt(pId, 10);
                
                let foundQty = 0;
                let found = false;

                if (tempStockByName[cleanName] !== undefined) {
                    foundQty = tempStockByName[cleanName];
                    found = true;
                } else if (tempStockById[pId] !== undefined) {
                    foundQty = tempStockById[pId];
                    found = true;
                } else if (!isNaN(pIdInt) && tempStockByIdInt[pIdInt] !== undefined) {
                    foundQty = tempStockByIdInt[pIdInt];
                    found = true;
                }

                stockData[pId] = found ? foundQty : 0;
            });

            top20Data = new Set();
            if (rawTop20.length > 0) {
                let amountCol = null;
                for (let i = 0; i < Math.min(5, rawTop20.length); i++) {
                    for (let key in rawTop20[i]) {
                        if (key.includes('金額') || key.includes('總值') || key.includes('成本') || key.includes('小計') || key.includes('總額')) {
                            amountCol = key;
                            break;
                        }
                    }
                    if(amountCol) break;
                }

                if (amountCol) {
                    rawTop20.sort((a, b) => {
                        let valA = Number(String(a[amountCol] || '0').replace(/,/g, '')) || 0;
                        let valB = Number(String(b[amountCol] || '0').replace(/,/g, '')) || 0;
                        return valB - valA; 
                    });
                }

                let matchedCount = 0;
                for (let i = 0; i < rawTop20.length; i++) {
                    if (matchedCount >= 20) break; 

                    let row = rawTop20[i];
                    let rawId = String(row['項次'] || '').trim();
                    let idInt = parseInt(rawId, 10).toString(); 

                    let rawName = '';
                    for (let key in row) {
                        if (key.includes('品名') || key.includes('名稱') || key.includes('商品')) {
                            rawName = String(row[key]).trim(); break;
                        }
                    }
                    if (!rawName) {
                        const vals = Object.values(row).filter(v => typeof v === 'string' && v.trim() !== '');
                        if (vals.length > 0 && isNaN(Number(vals[0].replace(/,/g, '')))) rawName = vals[0];
                    }
                    let cleanN = cleanString(rawName);

                    let isStoreProduct = false;
                    for (let p of productsData) {
                        let pId = p.id;
                        let pIdInt = parseInt(pId, 10).toString();
                        let pName = cleanString(p.name);

                        if (
                            (rawId && (pId === rawId || pIdInt === idInt)) ||
                            (cleanN && pName && (pName === cleanN || (cleanN.length >= 3 && pName.length >= 3 && (pName.includes(cleanN) || cleanN.includes(pName)))))
                        ) {
                            isStoreProduct = true;
                            break;
                        }
                    }

                    if (isStoreProduct) {
                        if (rawId) top20Data.add(rawId);
                        if (idInt !== "NaN") top20Data.add(idInt);
                        if (cleanN) top20Data.add(cleanN);
                        matchedCount++;
                    }
                }
            }

            saveState();
            renderTable();
            document.getElementById('btnCompare').innerText = '比對差異';

        } catch (error) {
            console.error(error);
            alert('檔案解析發生錯誤。');
            document.getElementById('btnCompare').innerText = '比對差異';
        }
    }

    async function mergeData() {
        const fileMerge = document.getElementById('fileMerge').files[0];
        if (!fileMerge) {
            alert('請先選擇要合併的 Excel 檔案！');
            return;
        }

        try {
            document.getElementById('btnMerge').innerText = '合併計算中...';
            const rawMerge = await readExcelFile(fileMerge);

            let mergeCount = 0;

            rawMerge.forEach(row => {
                const id = String(row['項次'] || '').trim();
                let addedQty = row['實際盤點數量'];

                if (id && addedQty !== undefined && addedQty !== null && addedQty !== '') {
                    addedQty = Number(addedQty);
                    if (!isNaN(addedQty)) {
                        let currentQty = (userCounts[id] !== undefined && userCounts[id] !== '') ? Number(userCounts[id]) : 0;
                        userCounts[id] = currentQty + addedQty;
                        mergeCount++;
                    }
                }
            });

            saveState();
            renderTable();
            document.getElementById('btnMerge').innerText = '🔄 匯入並加總數量';
            alert(`✅ 合併成功！共成功加總了 ${mergeCount} 筆有盤點數量的資料。`);
            document.getElementById('fileMerge').value = '';

        } catch (error) {
            console.error(error);
            alert('檔案解析發生錯誤，請確認上傳的是系統匯出的 Excel 檔。');
            document.getElementById('btnMerge').innerText = '🔄 匯入並加總數量';
        }
    }

    function renderTable() {
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

        let html = `
            <table>
                <thead>
                    <tr>
                        <th width="10%">項次</th>
                        <th width="40%">品名</th>
                        <th width="15%">系統帳面庫存</th>
                        <th width="15%">實際盤點數量</th>
                        <th width="20%">盤點差異</th>
                    </tr>
                </thead>
                <tbody>
        `;

        productsData.forEach((product, index) => {
            const pId = product.id;
            const pName = product.name;
            
            if (keyword) {
                if (!pId.toLowerCase().includes(keyword) && !pName.toLowerCase().includes(keyword)) {
                    return; 
                }
            }

            const sysStock = stockData ? (stockData[pId] !== undefined ? stockData[pId] : 0) : '尚未載入';
            const currentInputValue = userCounts[pId] !== undefined ? userCounts[pId] : '';

            let isTop20 = checkIsTop20(pId, pName);
            const trClass = isTop20 ? 'top-20-row' : '';
            const alertBadge = isTop20 ? '<span class="alert-badge">⚠️ 稽查重點</span>' : '';

            html += `
                <tr class="${trClass}">
                    <td>${pId}</td>
                    <td style="text-align: left;">${pName} ${alertBadge}</td>
                    <td style="color: #7f8c8d;">${sysStock}</td>
                    <td>
                        <input type="number" min="0" value="${currentInputValue}" 
                               oninput="handleInput('${pId}', ${index}, this.value)" 
                               placeholder="數量">
                    </td>
                    <td id="diff-${index}">-</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('tableContainer').innerHTML = html;

        if (stockData !== null) {
            productsData.forEach((product, index) => {
                const pId = product.id;
                if (document.getElementById(`diff-${index}`) && userCounts[pId] !== undefined && userCounts[pId] !== '') {
                    calculateDiffUI(pId, index, userCounts[pId]);
                }
            });
        }
    }

    function handleInput(pId, index, value) {
        userCounts[pId] = value;
        saveState();
        if (stockData !== null) {
            calculateDiffUI(pId, index, value);
        }
    }

    function calculateDiffUI(pId, index, countValue) {
        const resultCell = document.getElementById(`diff-${index}`);
        if (!resultCell) return; 

        const sysStock = stockData[pId] !== undefined ? stockData[pId] : 0;

        if (countValue === '') {
            resultCell.innerHTML = '-';
            resultCell.className = '';
            return;
        }

        const countStock = Number(countValue);
        const diff = countStock - sysStock;

        if (diff < 0) {
            resultCell.innerHTML = `少 ${Math.abs(diff)}`;
            resultCell.className = 'shortage';
        } else if (diff > 0) {
            resultCell.innerHTML = `多 ${diff}`;
            resultCell.className = 'surplus';
        } else {
            resultCell.innerHTML = `相符`;
            resultCell.className = 'match';
        }
    }

    async function exportToExcel() {
        if (productsData.length === 0) {
            alert("目前沒有資料可以匯出！");
            return;
        }

        const exportData = [];

        productsData.forEach((product) => {
            const pId = product.id;
            const sysStock = stockData && stockData[pId] !== undefined ? stockData[pId] : '尚未載入';
            const countValue = userCounts[pId] !== undefined ? userCounts[pId] : '';
            
            let diffResult = '-';
            if (countValue !== '' && sysStock !== '尚未載入') {
                const diff = Number(countValue) - Number(sysStock);
                if (diff < 0) diffResult = `少 ${Math.abs(diff)}`;
                else if (diff > 0) diffResult = `多 ${diff}`;
                else diffResult = '相符';
            }

            const isTop20Str = checkIsTop20(pId, product.name) ? "是" : "否";

            exportData.push({
                "項次": pId,
                "品名": product.name,
                "是否為稽查重點": isTop20Str,
                "系統帳面庫存": sysStock,
                "實際盤點數量": countValue,
                "盤點差異": diffResult
            });
        });

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "盤點結果");

        const today = new Date();
        const dateStr = today.getFullYear() + 
                        String(today.getMonth() + 1).padStart(2, '0') + 
                        String(today.getDate()).padStart(2, '0');
        const fileName = `店面盤點結果_${dateStr}.xlsx`;

        try {
            const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const file = new File([blob], fileName, { type: blob.type });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: '盤點結果',
                    text: '這是今天的店面盤點結果檔案'
                });
            } else {
                XLSX.writeFile(wb, fileName);
            }
        } catch (error) {
            console.log('分享取消或失敗:', error);
            if (error.name !== 'AbortError') {
                XLSX.writeFile(wb, fileName);
            }
        }
    }

    renderTable();

</script>
